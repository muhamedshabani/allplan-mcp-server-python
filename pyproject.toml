[project]
name = "allplan-mcp-server"
version = "0.1.0"
description = "FastMCP bridge for controlling an Allplan Python host."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp==3.2.4",
]

[project.scripts]
allplan-mcp = "allplan_mcp.server:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/allplan_mcp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "python_host/PythonPartsScripts"]
addopts = "-q --timeout=60"

[tool.ruff]
line-length = 100
target-version = "py311"
# The bridge runs inside Allplan's own interpreter, not this project's venv.
extend-exclude = [
    "python_host/PythonPartsScripts/PythonHost/StartPythonHost.py",
    # Sample code shipped to agents as skill content, written against the
    # Allplan runtime rather than this project's interpreter.
    "src/allplan_mcp/allplan_skills",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # The sandbox deliberately catches everything and returns it to the agent
    # as structured data rather than letting it escape as a 500.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Untouched upstream file. Reformatting it would rewrite every line, since it
# is the one file in the repo with CRLF endings.
"python_host/PythonPartsScripts/PythonHost/PythonHostHandler.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
exclude = ["src/allplan_mcp/allplan_skills"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
